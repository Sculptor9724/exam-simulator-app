<svg xmlns="http://www.w3.org/2000/svg" width="560" height="960" viewBox="0 0 560 960">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9d3c7"/>
      <stop offset="100%" stop-color="#c8c1b4"/>
    </linearGradient>

    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece7dc"/>
      <stop offset="55%" stop-color="#e5dfd3"/>
      <stop offset="100%" stop-color="#d9d2c4"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f0ebdf"/>
    </linearGradient>

    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e8a9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d6bf6b" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left frame -->
  <rect x="0" y="0" width="30" height="960" fill="url(#frame)"/>

  <!-- Right frame -->
  <rect x="530" y="0" width="30" height="960" fill="url(#frame)"/>

  <!-- Top frame -->
  <rect x="0" y="0" width="560" height="30" fill="url(#frame)"/>

  <!-- Door -->
  <rect x="30" y="30" width="500" height="930" rx="2" fill="url(#door)" stroke="#cfc7b8" stroke-width="2"/>

  <!-- exam paper -->
  <g transform="rotate(-1 280 280)" filter="url(#paperShadow)">
    <rect x="180" y="230" width="200" height="110" rx="2" fill="url(#paper)" stroke="#d4ccbb" stroke-width="1.2"/>

    <!-- tape -->
    <rect x="172" y="222" width="34" height="16" rx="2" fill="url(#tape)" transform="rotate(-18 190 230)"/>
    <rect x="364" y="222" width="34" height="16" rx="2" fill="url(#tape)" transform="rotate(16 380 230)"/>
    <rect x="172" y="332" width="34" height="16" rx="2" fill="url(#tape)" transform="rotate(17 190 340)"/>
    <rect x="364" y="332" width="34" height="16" rx="2" fill="url(#tape)" transform="rotate(-15 380 340)"/>

    <text x="280" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2f2d29">
      Eksamen, shh 🤫
    </text>
  </g>

  <!-- handle -->
  <g>
    <circle cx="470" cy="520" r="9" fill="#585858"/>
    <rect x="410" y="516" width="60" height="8" rx="4" fill="#9d9d9d"/>
    <circle cx="470" cy="520" r="4" fill="#404040"/>
  </g>

</svg>