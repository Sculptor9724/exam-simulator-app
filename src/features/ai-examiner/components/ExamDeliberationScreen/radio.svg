<svg width="560" height="340" viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b5f3b"></stop>
      <stop offset="50%" stop-color="#7a4528"></stop>
      <stop offset="100%" stop-color="#a86a45"></stop>
    </linearGradient>

    <linearGradient id="dialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd889"></stop>
      <stop offset="100%" stop-color="#e0a53d"></stop>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a524d"></stop>
      <stop offset="50%" stop-color="#2d2927"></stop>
      <stop offset="100%" stop-color="#8b847d"></stop>
    </linearGradient>

    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#201915"></rect>
      <circle cx="2" cy="2" r="1.1" fill="#d8c7a3"></circle>
      <circle cx="6" cy="6" r="1.1" fill="#d8c7a3"></circle>
    </pattern>

    <pattern id="grain" width="120" height="40" patternUnits="userSpaceOnUse">
      <rect width="120" height="40" fill="transparent"></rect>
      <path d="M0 10 C20 4, 40 16, 60 10 S100 4, 120 10" stroke="#6b3d25" stroke-width="1" fill="none" opacity="0.35"></path>
      <path d="M0 22 C20 16, 40 28, 60 22 S100 16, 120 22" stroke="#b9784e" stroke-width="1" fill="none" opacity="0.25"></path>
      <path d="M0 32 C20 26, 40 38, 60 32 S100 26, 120 32" stroke="#6b3d25" stroke-width="1" fill="none" opacity="0.28"></path>
    </pattern>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Main body -->
    <rect x="20" y="70" rx="28" ry="28" width="520" height="220" fill="url(#wood)" stroke="#6d3f26" stroke-width="6"></rect>
    <rect x="20" y="70" rx="28" ry="28" width="520" height="220" fill="url(#grain)" opacity="0.55"></rect>

    <!-- Top control tray -->
    <rect x="150" y="92" rx="10" ry="10" width="220" height="46" fill="#8f603f" stroke="#b98a5e" stroke-width="3"></rect>

    <!-- Knobs -->
    <g>
      <circle cx="205" cy="115" r="14" fill="#8a5938"></circle>
      <circle cx="205" cy="115" r="10" fill="#b37a50"></circle>

      <circle cx="260" cy="115" r="16" fill="#7a4b2f"></circle>
      <circle cx="260" cy="115" r="11" fill="#b88454"></circle>

      <circle cx="315" cy="115" r="14" fill="#8a5938"></circle>
      <circle cx="315" cy="115" r="10" fill="#b37a50"></circle>
    </g>

    <!-- Antenna -->
    <g>
      <rect x="452" y="86" width="8" height="102" rx="4" fill="#8f8f8f"></rect>
      <rect x="454" y="50" width="4" height="38" rx="2" fill="#a9a9a9"></rect>
      <rect x="455" y="24" width="2.5" height="28" rx="2" fill="#c4c4c4"></rect>
      <circle cx="456.25" cy="20" r="4" fill="#777"></circle>
    </g>

    <!-- Speaker cloth -->
    <rect x="52" y="150" rx="14" ry="14" width="420" height="110" fill="url(#mesh)" stroke="#a36b47" stroke-width="4"></rect>

    <!-- Tuning dial -->
    <g>
      <circle cx="420" cy="205" r="44" fill="url(#dialGlow)" stroke="#a86d2f" stroke-width="6"></circle>
      <circle cx="420" cy="205" r="30" fill="#231d1a" stroke="#5d544f" stroke-width="5"></circle>
      <circle cx="420" cy="205" r="19" fill="url(#metal)" stroke="#9b948d" stroke-width="2"></circle>

      <g stroke="#9c5e20" stroke-width="3" stroke-linecap="round">
        <line x1="420" y1="167" x2="420" y2="176"></line>
        <line x1="438" y1="172" x2="434" y2="180"></line>
        <line x1="451" y1="185" x2="443" y2="189"></line>
        <line x1="458" y1="205" x2="449" y2="205"></line>
        <line x1="451" y1="225" x2="443" y2="221"></line>
        <line x1="438" y1="238" x2="434" y2="230"></line>
        <line x1="420" y1="243" x2="420" y2="234"></line>
        <line x1="402" y1="238" x2="406" y2="230"></line>
        <line x1="389" y1="225" x2="397" y2="221"></line>
        <line x1="382" y1="205" x2="391" y2="205"></line>
        <line x1="389" y1="185" x2="397" y2="189"></line>
        <line x1="402" y1="172" x2="406" y2="180"></line>
      </g>

      <line x1="420" y1="205" x2="410" y2="175" stroke="#d84a2d" stroke-width="5" stroke-linecap="round"></line>
    </g>
  </g>
</svg>